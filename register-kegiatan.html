<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Registrasi Kegiatan</title>
    <link rel="stylesheet" href="css/style-register.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-light shadow-sm">
      <div class="container-fluid">
        <!-- LOGO KIRI -->
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="assets/img/logo.png" alt="Logo" height="40" class="me-2" />
        </a>

        <!-- TOGGLER -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- MENU -->
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <!-- MENU TENGAH -->
          <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" href="#">Perkemahan</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Pelatihan</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Kegiatan</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Latihan</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Sidang</a>
            </li>
          </ul>

          <!-- SEARCH KANAN -->
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Cari kegiatan..."
              aria-label="Search" />
            <button class="btn btn-outline-primary" type="submit">Cari</button>
          </form>
        </div>
      </div>
    </nav>

    <main class="main-wrapper">
      <div class="card mt-3">
        <div class="card-header">
          <h3 class="mb-0">Formulir Pendaftaran Perkemahan</h3>
          <span
            >Silahkan daftarkan peserta anda dengan mengisi formulilr dibawah
            ini!</span
          >
        </div>

        <div class="card-body">
          <form id="formPendaftaran">
            <div class="row g-3">
              <!-- Nama -->
              <div class="col-md-6">
                <label class="form-label">Nama Lengkap</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Masukkan nama lengkap"
                  required
                  oninput="this.value = this.value.toUpperCase();" />
              </div>

              <!-- NTA -->
              <div class="col-md-6">
                <label class="form-label">NTA</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Nomor Tanda Anggota"
                  required
                  maxlength="15"
                  inputmode="numeric"
                  pattern="[0-9]{1,15}"
                  oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 15);" />
              </div>

              <!-- Jenis Kelamin -->
              <div class="col-md-6">
                <label class="form-label">Jenis Kelamin</label>
                <select class="form-select" required>
                  <option value="">Pilih</option>
                  <option value="Laki-laki">Laki-laki</option>
                  <option value="Perempuan">Perempuan</option>
                </select>
              </div>

              <!-- Tempat Lahir -->
              <div class="col-md-6">
                <label class="form-label">Tempat Lahir</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Tempat lahir"
                  required
                  oninput="this.value = this.value.toUpperCase();" />
              </div>

              <!-- Tanggal Lahir -->
              <div class="col-md-6">
                <label class="form-label">Tanggal Lahir</label>
                <input type="date" class="form-control" required />
              </div>

              <!-- Pangkalan -->
              <div class="col-md-6">
                <label class="form-label">Pangkalan</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Nama sekolah / pangkalan"
                  required />
              </div>

              <!-- Gugus Depan -->
              <div class="col-md-6">
                <label class="form-label">Gugus Depan</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Contoh: 01.123 - 01.124"
                  required />
              </div>

              <!-- Alamat Lengkap -->
              <div class="col-md-6">
                <label class="form-label">Alamat Lengkap</label>
                <textarea
                  class="form-control"
                  rows="3"
                  placeholder="Masukkan alamat lengkap"
                  required></textarea>
              </div>

              <!-- Pilihan Perkemahan -->
              <div class="col-md-6">
                <label class="form-label">Jenis Perkemahan</label>
                <select class="form-select" required>
                  <option value="">Pilih Perkemahan</option>
                  <option value="Raimuna Ranting">Raimuna Ranting</option>
                  <option value="Peran Saka">Peran Saka</option>
                  <option value="Perkemahan Wirakarya">
                    Perkemahan Wirakarya
                  </option>
                </select>
              </div>

              <!-- Upload Surat Izin Orang Tua -->
              <div class="col-md-6">
                <label class="form-label">Surat Izin Orang Tua</label>
                <input
                  type="file"
                  class="form-control"
                  accept=".pdf,.jpg,.png"
                  required />
                <small class="text-muted">Format: PDF / JPG / PNG</small>
              </div>

              <!-- Upload Surat Izin Pangkalan -->
              <div class="col-md-6">
                <label class="form-label">Surat Izin Pangkalan</label>
                <input
                  type="file"
                  class="form-control"
                  accept=".pdf,.jpg,.png"
                  required />
                <small class="text-muted">Format: PDF / JPG / PNG</small>
              </div>

              <!-- Button -->
              <div class="col-12 text-end mt-3">
                <button type="submit" class="btn btn-primary">Daftar</button>
              </div>
            </div>
          </form>

          <div class="card mt-4 d-none" id="cardID">
            <div class="card-body text-center">
              <h5 class="fw-bold">ID CARD PESERTA</h5>
              <hr />

              <p class="mb-1">
                <strong>Nama:</strong> <span id="cardNama"></span>
              </p>
              <p class="mb-1">
                <strong>NTA:</strong> <span id="cardNta"></span>
              </p>
              <p class="mb-1"><strong>JK:</strong> <span id="cardJk"></span></p>
              <p class="mb-1">
                <strong>Pangkalan:</strong> <span id="cardPangkalan"></span>
              </p>
              <p class="mb-3">
                <strong>Perkemahan:</strong> <span id="cardKemah"></span>
              </p>

              <div id="qrcode" class="d-flex justify-content-center"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      document
        .getElementById("formPendaftaran")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const data = {
            nama: document.getElementById("nama").value,
            nta: document.getElementById("nta").value,
            jk: document.getElementById("jk").value,
            pangkalan: document.getElementById("pangkalan").value,
            kemah: document.getElementById("jenisPerkemahan").value,
            waktu: new Date().toISOString(),
          };

          // Ambil data lama
          const peserta =
            JSON.parse(localStorage.getItem("pesertaKemah")) || [];
          peserta.push(data);
          localStorage.setItem("pesertaKemah", JSON.stringify(peserta));

          tampilkanIDCard(data);
          this.reset();
        });

      function tampilkanIDCard(data) {
        document.getElementById("cardNama").innerText = data.nama;
        document.getElementById("cardNta").innerText = data.nta;
        document.getElementById("cardJk").innerText = data.jk;
        document.getElementById("cardPangkalan").innerText = data.pangkalan;
        document.getElementById("cardKemah").innerText = data.kemah;

        document.getElementById("cardID").classList.remove("d-none");

        // Reset QR
        document.getElementById("qrcode").innerHTML = "";

        new QRCode(document.getElementById("qrcode"), {
          text: JSON.stringify(data),
          width: 120,
          height: 120,
        });
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"></script>
  </body>
</html>

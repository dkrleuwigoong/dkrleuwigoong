<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pilih Role | SIMATAN</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous" />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet" />

    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #198754, #0d6efd);
      }
      .role-card {
        border-radius: 15px;
        transition: 0.3s;
        cursor: pointer;
      }
      .role-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }
      .role-icon {
        font-size: 50px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="card p-4 text-center">
            <h3 class="fw-bold mb-1">SIMATAN</h3>
            <p class="text-muted mb-4">
              Sistem Informasi Manajemen Pramuka Penegak & Pandega
            </p>

            <div class="row g-4">
              <!-- Dewan Ambalan -->
              <div class="col-md-6">
                <a
                  href="users/login-ambalan.html"
                  class="text-decoration-none text-dark">
                  <div class="card role-card p-4">
                    <i
                      class="bi bi-people-fill role-icon text-success mb-3"></i>
                    <h5 class="fw-semibold">Dewan Ambalan</h5>
                    <small class="text-muted">
                      Akses pengelolaan ambalan
                    </small>
                  </div>
                </a>
              </div>

              <!-- Dewan Kerja -->
              <div class="col-md-6">
                <a href="login-dk.html" class="text-decoration-none text-dark">
                  <div class="card role-card p-4">
                    <i
                      class="bi bi-diagram-3-fill role-icon text-primary mb-3"></i>
                    <h5 class="fw-semibold">Dewan Kerja</h5>
                    <small class="text-muted"> Akses manajemen kegiatan </small>
                  </div>
                </a>
              </div>
            </div>

            <div class="mt-4">
              <small class="text-muted"> © 2026 SIMATAN </small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>simpro-v1-dkrleuwigoong</title>

  <!-- BOOTSTRAP ICON -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
    }

    /* CONTAINER */
    .container-login {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* KIRI (FORM) */
    .left {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      /* background */
      background: url("img/background-aviasi.jpg") center/cover no-repeat;
      position: relative;
    }

    /* overlay biar teks/form tetap jelas */
    .left::before {
      content: "";
      position: absolute;
      inset: 0;
    }

    .login-box {
      width: 100%;
      max-width: 350px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .logo {
      width: 140px;
      margin-bottom: 30px;
    }

    h5 {
      margin-bottom: 20px;
      font-size: 15px;
      color: #444;
      text-align: left;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      font-size: 14px;
      color: #333;
    }

    .input-box {
      position: relative;
      margin-top: 5px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background: #fafafa;
      font-size: 14px;
    }

    input:focus {
      border-color: #0066ff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.15);
      background: #fff;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #666;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #0066ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
    }

    button:hover {
      background: #004fd6;
    }

    .register-text {
      margin-top: 10px;
      font-size: 13px;
      text-align: left;
    }

    .register-text a {
      color: #0066ff;
      font-weight: 600;
      text-decoration: none;
    }

    .exit {
      margin-top: 10px;
      font-size: 13px;
      text-align: left;
    }

    .exit a {
      color: red;
      font-weight: 600;
      text-decoration: none;
    }

    /* KANAN (GAMBAR) */
    .right {
      flex: 1;
      background: url("img/background-aviasi2.jpg") center/cover no-repeat;
      position: relative;
      overflow: hidden;
    }

    /* overlay gelap + gradasi */
    .right::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(0, 0, 0, 0.6),
          rgba(0, 0, 0, 0.3));
    }


    .right-text {
      position: absolute;
      bottom: 40px;
      left: 40px;
      color: #fff;
      z-index: 2;
    }

    .right-text h2 {
      font-size: 28px;
    }

    .right-text p {
      font-size: 14px;
      opacity: 0.9;
    }

    /* RESPONSIVE HP */
    @media (max-width: 786px) {

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        /* kunci supaya tidak scroll */
      }

      .container-login {
        flex-direction: column;
        height: 100dvh;
      }

      .right {
        display: none;
      }

      .right-text {
        bottom: 20px;
        left: 20px;
      }

      .left {
        width: 100%;
        height: 100dvh;
        background: none;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .left::before {
        display: none;
      }

      .login-box {
        width: 100%;
        max-width: 500px;
        padding: 20px;
        box-sizing: border-box
      }
    }
  </style>
</head>

<body>

  <div class="container-login">

    <!-- KIRI -->
    <div class="left">
      <form class="login-box" id="formLogin">
        <img src="img/simpro.png" class="logo" />

        <h5>Silahkan masuk dengan akun anda.</h5>

        <div class="form-group">
          <label>Username</label>
          <div class="input-box">
            <input type="text" id="username" placeholder="Masukan username" required />
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-box">
            <input type="password" id="password" placeholder="Masukan password" required />
            <i class="bi bi-eye toggle-password" onclick="togglePassword()"></i>
          </div>
        </div>

        <button type="submit">Masuk</button>

        <div class="register-text">
          Belum punya akun?
          <a href="register.html">Daftar</a>
        </div>
        <div class="exit">
          Menu utama <a href="index.html">Keluar</a>
        </div>
      </form>
    </div>

    <!-- KANAN -->
    <div class="right">
      <div class="right-text">
        <h2>AVIASI</h2>
        <p>Administrasi Virtual Integrasi Anggota dan Sistem Informasi</p>
      </div>
    </div>

  </div>

  <script>
    document.getElementById("formLogin").addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      const users = JSON.parse(localStorage.getItem("users")) || [];

      const user = users.find(u => u.username === username && u.password === password);

      if (user) {
        localStorage.setItem("userLogin", JSON.stringify(user));
        alert("Login berhasil!");
        window.location.href = "admin/dashboard.html";
      } else {
        alert("Username atau password salah!");
      }
    });

    function togglePassword() {
      const input = document.getElementById("password");
      input.type = input.type === "password" ? "text" : "password";
    }
  </script>

</body>

</html>

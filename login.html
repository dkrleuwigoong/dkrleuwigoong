<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMDEKA</title>

    <!-- FONT POPPINS -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet" />

    <!-- BOOTSTRAP -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
      }

      body {
        background: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        padding: 20px;
      }

      .login-container {
        width: 100%;
        max-width: 380px;
        background: #fff;
        padding: 30px 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      .logo {
        width: 150px;
        margin-bottom: 12px;
      }

      h5 {
        margin-bottom: 20px;
        font-size: 15px;
        font-weight: 500;
        color: #333;
      }

      .form-group {
        margin-bottom: 15px;
        text-align: left;
      }

      label {
        font-size: 15px;
        color: #444;
        margin: 0;
      }

      .input-box {
        position: relative;
        margin-top: 5px;
      }

      input {
        width: 100%;
        padding: 15px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 14px;
        background: #fafafa;
        transition: 0.2s ease;
      }

      input:focus {
        border-color: #0066ff;
        outline: none;
        box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.18);
        background: #fff;
      }

      .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
        font-size: 18px;
        color: #666;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #0066ff;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        margin-top: 10px;
        cursor: pointer;
        transition: 0.25s;
        margin-bottom: 10px;
      }

      button:hover {
        background: #004fd6;
      }

      a span {
        position: fixed;
        top: 15px;
        right: 40px;
        width: 50px;
        height: 40px;
        color: #000000;
        display: flex;
        z-index: 1000;
        font-size: large;
        font-weight: 600;
      }

      a span:hover {
        color: #ff0019;
        transform: scale(1.05);
      }

      span a {
        font-style: none;
      }

      .register-link {
        color: #0d6efd; /* biru bootstrap */
        font-weight: 600;
        text-decoration: none;
        position: relative;
        transition: 0.3s;
      }

      /* garis bawah animasi */
      .register-link::after {
        position: absolute;
        left: 0;
        bottom: -3px;
        width: 0;
        height: 2px;
        background-color: #0d6efd;
      }

      .register-link:hover::after {
        width: 100%;
      }
    </style>
  </head>

  <body>
    <a href="index.html">
      <span>Kembali</span>
    </a>

    <form class="login-container" id="formLogin">
      <img src="admin/icon/simdeka_official.png" class="logo" alt="Logo" />

      <h5>Silahkan masuk dengan akun anda</h5>

      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-box">
          <input
            type="text"
            class="form-control"
            id="username"
            placeholder="Masukan username"
            required />
          <div class="invalid-feedback">Please choose a username.</div>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-box">
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Masukkan password"
            required />
          <i class="bi bi-eye toggle-password" onclick="togglePassword()"></i>
        </div>
      </div>

      <button type="submit">Masuk</button>

      <span>
        Belum punya akun?
        <a href="register.html" class="register-link">Daftar</a>
      </span>
    </form>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"></script>
    <script>
      document
        .getElementById("formLogin")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const username = document.getElementById("username").value.trim();
          const password = document.getElementById("password").value;

          const users = JSON.parse(localStorage.getItem("users")) || [];

          const user = users.find(
            (u) => u.username === username && u.password === password
          );

          if (user) {
            localStorage.setItem("userLogin", JSON.stringify(user));
            alert("Login berhasil!");
            window.location.href = "admin/dashboard.html";
          } else {
            alert("Username atau password salah!");
          }
        });

      function togglePassword() {
        const input = document.getElementById("password");
        input.type = input.type === "password" ? "text" : "password";
      }
    </script>
  </body>
</html>

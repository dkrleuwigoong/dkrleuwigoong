      crossorigin="anonymous" />
    <link

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <aside class="sidebar">

      </div>

      <ul class="sidebar-menu">

          <a href="dashboard.html">

        </li>

        <li>
          <a href="data-anggota.html">

        </li>

        <li>
          <a href="jadwal.html">
            <span class="material-symbols-outlined">event</span>
            <span>Jadwal Kegiatan</span>
          </a>
        </li>

        <li>
          <a href="presensi.html">
            <span class="material-symbols-outlined">fact_check</span>

          </a>
        </li>

        <li class="active">

            <span class="material-symbols-outlined">description</span>

        <li>
          <a href="#">
            <span class="material-symbols-outlined">settings</span>
            <span>Pengaturan</span>

        </li>
      </ul>

    <nav class="navbar">
      <!-- KIRI : TOGGLE -->
      <div class="navbar-left">
        <button class="btn btn-toggle-sidebar p-0 border-0 bg-transparent">
          <span class="material-symbols-outlined fs-2 text-success">
            menu
          </span>
        </button>
      </div>

      <!-- KANAN : USER -->
      <div class="navbar-right">
        <div class="navbar-user">
          <span class="material-symbols-outlined">account_circle</span>
          <span class="username">-</span>
        </div>

        <button class="navbar-icon">
          <span class="material-symbols-outlined">notifications</span>
          <span class="notif-badge">3</span>
        </button>

        <button class="navbar-icon logout">
          <span class="material-symbols-outlined">logout</span>

      </div>

    <main class="main">
      <div class="laporan-container">
        <nav style="--bs-breadcrumb-divider: '>'" aria-label="breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="laporan.html">Home</a></li>
            <li class="breadcrumb-item active" aria-current="page">Kegiatan</li>
          </ol>
        </nav>
      </div>

      <div class="laporan-card">
        <h4>Data Peserta Kegiatan</h4>

        <div class="table-wrapper">
          <table id="tabelPeserta" class="laporan-table">
            <thead>
              <tr>
                <th>No</th>
                <th>Nama</th>
                <th>JK</th>
                <th>Asal</th>
                <th>Kegiatan</th>
                <th>Tanggal</th>
                <th>No HP</th>
                <th>Kategori</th>
                <th>Bukti</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody>
              <!-- Data otomatis -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <div id="modalVerifikasi" class="modal">
      <div class="modal-content">
        <span class="close" onclick="closeVerifikasi()">&times;</span>
        <h3>Verifikasi Peserta</h3>

        <video id="video" width="100%" autoplay></video>
        <canvas id="canvas" hidden></canvas>

        <p id="hasilVerifikasi"></p>
      </div>
    </div>

    <script>
      const sidebar = document.querySelector(".sidebar");

      document.querySelectorAll(".sidebar a").forEach((link) => {
        link.addEventListener("click", () => {
          if (window.innerWidth <= 768) {
            sidebar.classList.remove("active");
          }
        });
      });

      document.addEventListener("click", (e) => {
        if (
          window.innerWidth <= 768 &&
          sidebar.classList.contains("active") &&
          !sidebar.contains(e.target) &&
          !e.target.classList.contains("btn-toggle-sidebar")
        ) {
          sidebar.classList.remove("active");
        }
      });

      const btnToggle = document.querySelector(".btn-toggle-sidebar");
      if (btnToggle) {
        btnToggle.addEventListener("click", (e) => {
          e.stopPropagation(); // supaya tidak langsung tertutup
          sidebar.classList.toggle("active");
        });
      }

      function toggleSidebar() {
        document.querySelector(".sidebar").classList.toggle("active");
      }

      document.addEventListener("DOMContentLoaded", function () {
        // Ambil data user yang sedang login
        const userLogin = JSON.parse(localStorage.getItem("userLogin"));

        if (userLogin) {
          // Tampilkan nama atau username
          document.querySelector(".username").textContent =
            userLogin.nama || userLogin.username;
        } else {
          // Jika belum login
          document.querySelector(".username").textContent = "Guest";
        }
      });

      const tabelBody = document.querySelector("#tabelPeserta tbody");

      function renderTabelPeserta() {
        const dataPesert =
          JSON.parse(localStorage.getItem("dataPeserta")) || [];
        tabelBody.innerHTML = "";

        if (dataPesert.length === 0) {
          tabelBody.innerHTML = `
      <tr>
        <td colspan="10" style="text-align:center;">
          Belum ada data peserta
        </td>
      </tr>
    `;
          return;
        }

        dataPesert.forEach((p, i) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
      <td>${i + 1}</td>
      <td>${p.nama}</td>
      <td>${p.jk}</td>
      <td>${p.asal}</td>
      <td>${p.kegiatan}</td>
      <td>${p.tanggal}</td>
      <td>${p.nohp}</td>
      <td>${p.kategori}</td>
      <td>
        <button class="btn-qr" onclick="showQR(${p.id})">
          Lihat
        </button>
      </td>
      <td>
        <button class="btn-verif" onclick="openVerifikasi(${p.id})">
          Verifikasi
        </button>
      </td>
    `;
          tabelBody.appendChild(tr);
        });
      }

      // Jalankan saat halaman dibuka
      renderTabelPeserta();

      function showQR(id) {
        const dataPesert = JSON.parse(localStorage.getItem("dataPeserta")) || [];
        const peserta = dataPesert.find((p) => p.id === id);

        if (!peserta) return;

        qrDiv.innerHTML = "";
        qrCard.style.display = "block";

        new QRCode(qrDiv, {
          text: JSON.stringify(peserta),
          width: 200,
          height: 200,
        });

        qrInfo.innerHTML = `
      <strong>${peserta.nama}</strong><br>
      ${peserta.kegiatan}<br>
      ${peserta.tanggal}
    `;
      }

      const modal = document.getElementById("modalVerifikasi");
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const hasil = document.getElementById("hasilVerifikasi");

      let stream;

      function openVerifikasi(id) {
        pesertaAktif = id;
        scanning = true;
        modal.style.display = "block";
        hasil.innerHTML = "Arahkan QR Code ke kamera...";
        startCamera();
      }

      function closeVerifikasi() {
        modal.style.display = "none";
        stopCamera();
      }

      function startCamera() {
        navigator.mediaDevices
          .getUserMedia({ video: { facingMode: "environment" } })
          .then((s) => {
            stream = s;
            video.srcObject = stream;
            requestAnimationFrame(scanQR);
          })
          .catch((err) => {
            hasil.innerHTML = "Kamera tidak dapat diakses";
          });
      }

      function stopCamera() {
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }
      }

      function scanQR() {
        if (!scanning) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = jsQR(imageData.data, canvas.width, canvas.height);

          if (code) {
            scanning = false;
            verifikasiPeserta(code.data);
            return;
          }
        }
        requestAnimationFrame(scanQR);
      }

      function verifikasiPeserta(qrData) {
        stopCamera();

        try {
          const dataQR = JSON.parse(qrData);
          let dataPesert =
            JSON.parse(localStorage.getItem("dataPeserta")) || [];

          const index = dataPesert.findIndex((p) => p.id === dataQR.id);

          if (index !== -1 && dataPesert[index].id === pesertaAktif) {
            dataPesert[index].hadir = true;
            dataPesert[index].waktuHadir = new Date().toLocaleString("id-ID");

            localStorage.setItem("dataPesert", JSON.stringify(dataPesert));

            hasil.innerHTML = `
        ✅ <strong>VERIFIKASI BERHASIL</strong><br>
        Nama: ${dataPesert[index].nama}<br>
        Waktu: ${dataPesert[index].waktuHadir}
      `;

            renderTabelPeserta();
          } else {
            hasil.innerHTML = "❌ QR tidak sesuai peserta";
          }
        } catch {
          hasil.innerHTML = "❌ QR Code tidak valid";
        }
      }

      let pesertaAktif = null;
      let scanning = false;
      const qrDiv = document.getElementById("qrcode");
      const qrCard = document.getElementById("qrCard");
      const qrInfo = document.getElementById("qrInfo");
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  </body>
</html>

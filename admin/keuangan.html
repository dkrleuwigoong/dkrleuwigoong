            <span>Data Anggota</span>
          </a>
        </li>

        <li class="list-group-item">
          <a href="kegiatan.html">
            <i class="bi bi-calendar-event"></i>
            <span>Kegiatan</span>
          </a>
        </li>

        <li class="list-group-item active">
          <a href="keuangan.html">

        </li>

    <div class="main-wrapper">
      <nav class="navbar">
        <!-- KIRI : TOGGLE -->

          <!-- Toggle Sidebar -->

          <!-- Search Bar -->

            <input type="text" class="form-control search-input" placeholder="Cari..." aria-label="Search">

        </div>

        <!-- KANAN : USER -->

          <!-- Profile -->
          <button class="navbar-icon" aria-label="Profile">

          <!-- Notifications -->

      <main class="main">

        <div class="card mb-3 shadow bg-body rounded">
          <div class="card-body">

            <!-- HEADER HALAMAN -->
            <div class="d-flex justify-content-between align-items-center mb-2">

              <div>
                <h3 class="mb-0">Keuangan</h3>
                <small class="text-muted">
                  Data pemasukan dan pengeluaran kegiatan
                </small>
              </div>

              <button class="btn btn-primary btn-sm">
                + Tambah Data
              </button>

            </div>

          </div>
        </div>

        <div class="card mb-3 shadow bg-body rounded">
          <div class="card-body">

            <!-- HEADER TABEL -->
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5 class="mb-0">Data Keuangan</h5>

              <input type="text" class="form-control form-control-sm w-25" placeholder="Cari data..."
                id="searchKeuangan">
            </div>

            <!-- TABLE -->
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                  <tr>
                    <th>No</th>
                    <th>Tanggal</th>
                    <th>Keterangan</th>
                    <th>Kategori</th>
                    <th>Jenis</th>
                    <th>Nominal</th>
                    <th>Aksi</th>
                  </tr>
                </thead>

                <tbody id="tabelKeuangan">
                  <!-- data localStorage tampil di sini -->
                </tbody>
              </table>
            </div>

          </div>
        </div>

        <!-- FOOTER -->
        <footer class="footer mt-4 shadow-sm">
          <div class="container-fluid">

            <div class="card shadow-sm">
              <div class="card-body py-3">

                <div class="row align-items-center">

                  <!-- LEFT -->
                  <div class="col-md-6 text-center text-md-start mb-2 mb-md-0">
                    <small class="text-muted">
                      © 2026 Dashboard DKR Leuwigoong.
                      All Rights Reserved.
                    </small>
                  </div>

                  <!-- RIGHT -->
                  <div class="col-md-6 text-center text-md-end">

                    <small class="text-muted">
                      Developed by
                      <span class="fw-semibold text-dark">
                        Riyadicreative
                      </span>
                    </small>

                  </div>

                </div>

              </div>
            </div>

          </div>
        </footer>
      </main>


      <script src="admin.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
      <script>

        // =========================
        // LOCAL STORAGE
        // =========================
        let dataKegiatan =
          JSON.parse(localStorage.getItem("dataKegiatan")) || [];

        // =========================
        // TAMPILKAN DATA
        // =========================
        function tampilkanData() {

          const tbody = document.querySelector(
            "#tabelKegiatan tbody"
          );

          tbody.innerHTML = "";

          dataKegiatan.forEach((item, index) => {

            tbody.innerHTML += `
  <tr>
    <td>${index + 1}</td>

    <td>${item.tanggal}</td>

    <td>${item.nama}</td>

    <td>
      <span class="badge bg-primary">
        ${item.tingkat}
      </span>
    </td>

    <td>${item.deskripsi}</td>

    <td>
      <span class="badge bg-success">
        ${item.kategori}
      </span>
    </td>

    <td>
      Rp ${Number(item.anggaran)
                .toLocaleString("id-ID")}
    </td>

    <!-- AKSI -->
    <td>
      <div class="d-flex gap-2">

        <!-- DETAIL -->
        <button
          class="btn btn-info btn-sm text-white"
          onclick="detailData(${index})"
        >
          <i class="bi bi-eye"></i>
        </button>

        <!-- EDIT -->
        <button
          class="btn btn-warning btn-sm text-dark"
          onclick="editData(${index})"
        >
          <i class="bi bi-pencil-square"></i>
        </button>

        <!-- HAPUS -->
        <button
          class="btn btn-danger btn-sm"
          onclick="hapusData(${index})"
        >
          <i class="bi bi-trash"></i>
        </button>

      </div>
    </td>
  </tr>
`;
          });

          // SIMPAN KE LOCALSTORAGE
          localStorage.setItem(
            "dataKegiatan",
            JSON.stringify(dataKegiatan)
          );
        }

        // =========================
        // TAMBAH DATA
        // =========================
        const form =
          document.getElementById("formKegiatan");

        form.addEventListener("submit", function (e) {

          e.preventDefault();

          const kegiatanBaru = {
            tanggal:
              document.getElementById("tanggal").value,

            nama:
              document.getElementById("nama").value,

            tingkat:
              document.getElementById("tingkat").value,

            kategori:
              document.getElementById("kategori").value,

            deskripsi:
              document.getElementById("deskripsi").value,

            anggaran:
              document.getElementById("anggaran").value
          };

          // PUSH DATA
          dataKegiatan.push(kegiatanBaru);

          // REFRESH TABLE
          tampilkanData();

          // RESET FORM
          form.reset();

          // TUTUP MODAL
          const modal =
            bootstrap.Modal.getInstance(
              document.getElementById("modalKegiatan")
            );

          modal.hide();
        });

        // =========================
        // LOAD AWAL
        // =========================
        tampilkanData();

        // =========================
        // DETAIL DATA
        // =========================
        // =========================
        // DETAIL DATA
        // =========================
        function detailData(index) {

          const item = dataKegiatan[index];

          // SET DATA
          document.getElementById("detailTanggal")
            .innerText = item.tanggal;

          document.getElementById("detailNama")
            .innerText = item.nama;

          document.getElementById("detailTingkat")
            .innerHTML = `
      <span class="badge bg-primary">
        ${item.tingkat}
      </span>
    `;

          document.getElementById("detailKategori")
            .innerHTML = `
      <span class="badge bg-success">
        ${item.kategori}
      </span>
    `;

          document.getElementById("detailAnggaran")
            .innerText =
            "Rp " +
            Number(item.anggaran)
              .toLocaleString("id-ID");

          document.getElementById("detailDeskripsi")
            .innerText = item.deskripsi;

          // TAMPILKAN MODAL
          const modal =
            new bootstrap.Modal(
              document.getElementById(
                "modalDetailKegiatan"
              )
            );

          modal.show();
        }

        // =========================
        // EDIT DATA
        // =========================
        // =========================
        // EDIT DATA
        // =========================
        function editData(index) {

          const item = dataKegiatan[index];

          // SIMPAN INDEX
          document.getElementById("editIndex").value =
            index;

          // SET VALUE
          document.getElementById("editTanggal").value =
            item.tanggal;

          document.getElementById("editNama").value =
            item.nama;

          document.getElementById("editTingkat").value =
            item.tingkat;

          document.getElementById("editKategori").value =
            item.kategori;

          document.getElementById("editDeskripsi").value =
            item.deskripsi;

          document.getElementById("editAnggaran").value =
            item.anggaran;

          // TAMPILKAN MODAL
          const modal =
            new bootstrap.Modal(
              document.getElementById(
                "modalEditKegiatan"
              )
            );

          modal.show();
        }

        // =========================
        // UPDATE DATA
        // =========================
        document
          .getElementById("formEditKegiatan")
          .addEventListener("submit", function (e) {

            e.preventDefault();

            const index =
              document.getElementById("editIndex").value;

            dataKegiatan[index] = {

              tanggal:
                document.getElementById("editTanggal").value,

              nama:
                document.getElementById("editNama").value,

              tingkat:
                document.getElementById("editTingkat").value,

              kategori:
                document.getElementById("editKategori").value,

              deskripsi:
                document.getElementById("editDeskripsi").value,

              anggaran:
                document.getElementById("editAnggaran").value
            };

            // UPDATE LOCALSTORAGE
            localStorage.setItem(
              "dataKegiatan",
              JSON.stringify(dataKegiatan)
            );

            // REFRESH TABEL
            tampilkanData();

            // TUTUP MODAL
            bootstrap.Modal.getInstance(
              document.getElementById(
                "modalEditKegiatan"
              )
            ).hide();
          });

        // =========================
        // HAPUS DATA
        // =========================
        function hapusData(index) {

          const konfirmasi = confirm(
            "Yakin ingin menghapus data ini?"
          );

          if (konfirmasi) {

            dataKegiatan.splice(index, 1);

            localStorage.setItem(
              "dataKegiatan",
              JSON.stringify(dataKegiatan)
            );

            tampilkanData();
          }
        }
      </script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

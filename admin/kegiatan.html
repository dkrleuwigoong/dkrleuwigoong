<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>simpro-v1-dkr-leuwigoong</title>
  <link rel="Icon" href="img/dkr-logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous" />

  <!-- Google Icons dan Font -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="asset/css/admin.css" />
</head>

<body>
  <!-- Sidebar Offcanvas -->
  <div class="offcanvas offcanvas-start" style="width: 250px" tabindex="-1" id="sidebar" aria-labelledby="sidebarLabel">
    <div class="offcanvas-header align-items-center">
      <img src="asset/icon/simpro.png" alt="" />
      <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body p-0">
      <ul class="list-group list-group-flush">
        <li class="list-group-item">
          <a href="dashboard.html" class="d-flex align-items-center text-decoration-none">
            <span class="material-symbols-outlined me-2">home</span> Dashboard
          </a>
        </li>

        <li class="list-group-item">
          <a href="data-anggota.html" class="d-flex align-items-center text-decoration-none">
            <span class="material-symbols-outlined me-2">groups</span>
            Data Anggota
          </a>
        </li>

        <li class="list-group-item active">
          <a href="kegiatan.html" class="d-flex align-items-center text-decoration-none">
            <span class="material-symbols-outlined me-2">calendar_month</span>
            Kegiatan
          </a>
        </li>

        <li class="list-group-item">
          <a href="#" class="d-flex align-items-center text-decoration-none">
            <span class="material-symbols-outlined me-2">attach_money</span>
            Keuangan
          </a>
        </li>

        <li class="list-group-item">
          <a href="#" class="d-flex align-items-center text-decoration-none">
            <span class="material-symbols-outlined me-2">article</span>
            Laporan
          </a>
        </li>

        <li class="list-group-item">
          <a href="#" class="d-flex align-items-center text-decoration-none">
            <span class="material-symbols-outlined me-2">settings</span> Pengaturan
          </a>
        </li>
      </ul>
    </div>
  </div>

  <div class="main-wrapper">
    <nav class="navbar">
      <!-- KIRI : TOGGLE -->
      <div class="navbar-left d-flex align-items-center gap-2">
        <!-- tombol menu -->
        <button class="btn btn-outline-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
          aria-controls="sidebar">
          <span class="material-symbols-outlined">menu</span>
        </button>

        <!-- search bar -->
        <div class="search-box position-relative">
          <span class="material-symbols-outlined search-icon">search</span>
          <input type="text" class="form-control ps-5" placeholder="Cari...">
        </div>
      </div>

      <!-- KANAN : USER -->
      <div class="navbar-right">
        <button class="navbar-icon">
          <span class="material-symbols-outlined">account_circle</span>
        </button>

        <button class="navbar-icon">
          <span class="material-symbols-outlined">notifications</span>
        </button>

        <button class="navbar-icon logout">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </nav>

    <main class="main">
      <div class="card shadow-sm">
        <div class="card-body py-3 px-4">
          <nav style="--bs-breadcrumb-divider: '>';" aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a href="#">Kegiatan</a></li>
            </ol>
          </nav>
        </div>
      </div>

      <div class="card shadow-sm mt-3">
        <div class="card-body">

          <div class="d-flex justify-content-between mb-3">
            <h5>Data Kegiatan</h5>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalForm">
              + Tambah
            </button>
          </div>

          <div class="table-responsive">
            <table class="table table-striped table-bordered w-100">
              <thead class="table-dark text-center">
                <tr>
                  <th>No</th>
                  <th>Nama</th>
                  <th>Deskripsi</th>
                  <th>Tanggal</th>
                  <th>Tingkat</th>
                  <th>Keterangan</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody id="tabelKegiatan"></tbody>
            </table>
          </div>

        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="modalForm" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Form Kegiatan</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <input type="hidden" id="editIndex">

          <div class="mb-2">
            <label>Nama Kegiatan</label>
            <input type="text" id="nama" class="form-control">
          </div>

          <div class="mb-2">
            <label>Deskripsi</label>
            <textarea id="deskripsi" class="form-control"></textarea>
          </div>

          <div class="mb-2">
            <label>Tanggal</label>
            <input type="date" id="tanggal" class="form-control">
          </div>

          <div class="mb-2">
            <label>Tingkat</label>
            <select id="tingkat" class="form-select">
              <option value="">-- Pilih --</option>
              <option value="gugusdepan">Gugusdepan</option>
              <option value="kwarran">Kwarran</option>
              <option value="kwarcab">Kwarcab</option>
              <option value="kwarda">Kwarda</option>
              <option value="kwarnas">Kwarnas</option>
            </select>
          </div>

          <div class="mb-2">
            <label>Keterangan</label>
            <input type="text" id="keterangan" class="form-control">
          </div>
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button class="btn btn-primary" onclick="simpanData()">Simpan</button>
        </div>

      </div>
    </div>
  </div>
  <script>
    let dataKegiatan = JSON.parse(localStorage.getItem("kegiatan")) || [];

    function simpanData() {
      const nama = document.getElementById("nama").value;
      const deskripsi = document.getElementById("deskripsi").value;
      const tanggal = document.getElementById("tanggal").value;
      const tingkat = document.getElementById("tingkat").value;
      const keterangan = document.getElementById("keterangan").value;
      const editIndex = document.getElementById("editIndex").value;

      const data = { nama, deskripsi, tanggal, tingkat, keterangan };

      if (editIndex === "") {
        dataKegiatan.push(data);
      } else {
        dataKegiatan[editIndex] = data;
      }

      localStorage.setItem("kegiatan", JSON.stringify(dataKegiatan));

      resetForm();
      renderTable();

      // tutup modal
      const modal = bootstrap.Modal.getInstance(document.getElementById('modalForm'));
      modal.hide();
    }

    function renderTable() {
      const tbody = document.getElementById("tabelKegiatan");
      tbody.innerHTML = "";

      dataKegiatan.forEach((item, index) => {
        tbody.innerHTML += `
      <tr>
        <td class="text-center">${index + 1}</td>
        <td>${item.nama}</td>
        <td>${item.deskripsi}</td>
        <td>${item.tanggal}</td>
        <td>${item.tingkat}</td>
        <td>${item.keterangan}</td>
        <td class="text-center">
          <button class="btn btn-warning btn-sm" onclick="editData(${index})">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="hapusData(${index})">Hapus</button>
        </td>
      </tr>
    `;
      });
    }

    function editData(index) {
      const item = dataKegiatan[index];

      document.getElementById("nama").value = item.nama;
      document.getElementById("deskripsi").value = item.deskripsi;
      document.getElementById("tanggal").value = item.tanggal;
      document.getElementById("tingkat").value = item.tingkat;
      document.getElementById("keterangan").value = item.keterangan;
      document.getElementById("editIndex").value = index;

      // buka modal
      const modal = new bootstrap.Modal(document.getElementById('modalForm'));
      modal.show();
    }

    function hapusData(index) {
      if (confirm("Yakin hapus data?")) {
        dataKegiatan.splice(index, 1);
        localStorage.setItem("kegiatan", JSON.stringify(dataKegiatan));
        renderTable();
      }
    }

    function resetForm() {
      document.getElementById("nama").value = "";
      document.getElementById("deskripsi").value = "";
      document.getElementById("tanggal").value = "";
      document.getElementById("tingkat").value = "";
      document.getElementById("keterangan").value = "";
      document.getElementById("editIndex").value = "";
    }

    // reset form saat klik tombol tambah
    document.getElementById("modalForm").addEventListener("show.bs.modal", function () {
      resetForm();
    });

    renderTable();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>register-aviasi-v1</title>

  <!-- BOOTSTRAP -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f7fa;
    }

    .register-container {
      max-width: 100%;
      margin: 30px;
      background: url("img/background-aviasi.jpg") center/cover no-repeat;
      padding: 50px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      align-self: center;
    }

    .register-container h2 {
      font-size: 20px;
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
    }

    .register-link {
      color: #0d6efd;
      font-weight: 600;
      text-decoration: none;
    }

    .register-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="register-container">
    <h2>Pendaftaran Akun</h2>

    <form id="formRegister" class="row g-3">
      <!-- Nama Lengkap -->
      <div class="col-md-6">
        <label class="form-label">Nama Lengkap</label>
        <input type="text" id="nama" class="form-control" required />
      </div>

      <div class="col-md-6">
        <label class="form-label">NTA</label>
        <input type="number" id="nta" class="form-control" placeholder="Nomor Tanda Anggota" />
      </div>

      <div class="col-12">
        <label class="form-label">Gugus Depan/Pangkalan</label>
        <input type="text" id="gudep" class="form-control" placeholder="Sekolah/Perguruan Tinggi" />
      </div>

      <div class="col-12">
        <label class="form-label">Jabatan</label>
        <select name="jabatan" id="jabatan" class="form-select" aria-label="Default select example">
          <option selected>Pilih Jabatan</option>
          <option value="Pradana Putra">Pradana Putra</option>
          <option value="Pradana Putri">Pradana Putri</option>
          <option value="Sekretaris">Sekretaris</option>
          <option value="Bendahara">Bendahara</option>
          <option value="Anggota">Anggota</option>
        </select>
      </div>

      <!-- No HP -->
      <div class="col-12">
        <label class="form-label">No HP</label>
        <input type="tel" id="nohp" class="form-control" placeholder="Masukan nomor telepon" required />
      </div>

      <div class="col-12">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Masukkan username anda" pattern="[a-z0-9_]+"
          title="Username hanya huruf kecil, angka, dan underscore. Tidak boleh spasi." required />
      </div>

      <!-- Password -->
      <div class="col-md-6">
        <label class="form-label">Password</label>
        <div class="input-group">
          <input type="password" id="password" class="form-control" placeholder="Masukan password" required />
          <span class="input-group-text" onclick="togglePassword('password', this)">
            <i class="bi bi-eye"></i>
          </span>
        </div>
      </div>

      <!-- Konfirmasi Password -->
      <div class="col-md-6">
        <label class="form-label">Konfirmasi Password</label>
        <div class="input-group">
          <input type="password" id="konfirmasi" class="form-control" placeholder="Konfirmasi Password" required />
          <span class="input-group-text" onclick="togglePassword('konfirmasi', this)">
            <i class="bi bi-eye"></i>
          </span>
        </div>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary w-100">Daftar</button>
      </div>
    </form>

    <div class="text-center mt-3">
      <span>
        Sudah punya akun?
        <a href="login.html" class="register-link">Masuk</a>
      </span>
    </div>
  </div>

  <script>
    function togglePassword(inputId, el) {
      const input = document.getElementById(inputId);
      const icon = el.querySelector("i");

      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("bi-eye");
        icon.classList.add("bi-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("bi-eye-slash");
        icon.classList.add("bi-eye");
      }
    }

    document
      .getElementById("formRegister")
      .addEventListener("submit", function (e) {
        e.preventDefault();

        const nama = document.getElementById("nama").value.trim();
        const nta = document.getElementById("nta").value.trim();
        const gudep = document.getElementById("gudep").value.trim();
        const jabatan = document.getElementById("jabatan").value.trim();
        const username = document.getElementById("username").value.trim();
        const nohp = document.getElementById("nohp").value.trim();
        const password = document.getElementById("password").value;
        const konfirmasi = document.getElementById("konfirmasi").value;

        // Validasi password
        if (password !== konfirmasi) {
          alert("Password dan Konfirmasi tidak sama!");
          return;
        }

        // Ambil data user Lama
        let users = JSON.parse(localStorage.getItem("users")) || [];

        // Cek username sudah ada
        const cekUser = users.find((u) => u.username === username);
        if (cekUser) {
          alert("Username sudah digunakan!");
          return;
        }

        users.push({
          nama,
          nta,
          gudep,
          jabatan,
          username,
          nohp,
          password,
        });

        localStorage.setItem("users", JSON.stringify(users));

        alert("Pendaftaran berhasil!");
        this.reset();
      });

    const usernameInput = document.getElementById("username");

    usernameInput.addEventListener("input", function () {
      // Hilangkan spasi
      this.value = this.value.replace(/\s/g, "");

      // Ubah semua huruf menjadi huruf kecil
      this.value = this.value.toLowerCase();
    });
  </script>
</body>

</html>

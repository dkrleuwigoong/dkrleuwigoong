<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Dewan Ambalan | SIMATAN</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet" />

    <style>
      body {
        background: linear-gradient(135deg, #198754, #0d6efd);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      .login-title {
        font-weight: 700;
        color: #198754;
      }
      .subtitle {
        font-size: 14px;
        color: #6c757d;
      }

      .container {
        max-width: 100%;
        padding: 20px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="card login-card">
            <div class="card-body">
              <div class="text-center mb-4">
                <h3 class="login-title">SIMATAN</h3>
                <p class="subtitle">Sistem Informasi Manajemen Kegiatan</p>
              </div>

              <form action="#" method="post">
                <div class="mb-3">
                  <label class="form-label">Username</label>
                  <input
                    type="text"
                    class="form-control"
                    placeholder="Masukkan username"
                    required />
                </div>

                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <div class="input-group">
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      placeholder="Masukkan password"
                      required />
                    <span
                      class="input-group-text"
                      style="cursor: pointer"
                      onclick="togglePassword()">
                      <i class="bi bi-eye" id="toggleIcon"></i>
                    </span>
                  </div>
                </div>

                <div class="d-grid mb-3">
                  <button type="submit" class="btn btn-success">Login</button>
                </div>

                <div class="text-center">
                  <small class="text-muted">
                    Belum punya akun?
                    <a
                      href="pendaftaran.html"
                      class="text-success fw-semibold text-decoration-none">
                      Daftar
                    </a>
                  </small>
                </div>
              </form>

              <div class="text-center mt-3">
                <small class="text-muted">
                  © 2026 SIMATAN • DKR Leuwigoong
                </small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script>
      function togglePassword() {
        const password = document.getElementById("password");
        const icon = document.getElementById("toggleIcon");

        if (password.type === "password") {
          password.type = "text";
          icon.classList.remove("bi-eye");
          icon.classList.add("bi-eye-slash");
        } else {
          password.type = "password";
          icon.classList.remove("bi-eye-slash");
          icon.classList.add("bi-eye");
        }
      }
    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pendaftaran Dewan Ambalan | SIMATAN</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous" />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet" />

    <style>
      body {
        background: linear-gradient(135deg, #198754, #0d6efd);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card p-4">
            <h4 class="text-center fw-bold mb-1">Pendaftaran Akun</h4>
            <p class="text-center text-muted mb-4">Dewan Ambalan • SIMATAN</p>

            <form id="registerForm">
              <div class="mb-3">
                <label class="form-label">Nama Lengkap</label>
                <input type="text" class="form-control" id="nama" required />
              </div>

              <div class="mb-3">
                <label class="form-label">NTA</label>
                <input type="text" class="form-control" id="nta" required />
              </div>

              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required />
              </div>

              <div class="mb-3">
                <label class="form-label">Surat Aktif Gudep</label>
                <input
                  type="file"
                  class="form-control"
                  id="surat"
                  accept=".pdf,.jpg,.png"
                  required />
                <small class="text-muted"> Format: PDF / JPG / PNG </small>
              </div>

              <div class="mb-3">
                <label class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  required />
              </div>

              <div class="mb-3">
                <label class="form-label">Konfirmasi Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="confirmPassword"
                  required />
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-success">Daftar</button>
              </div>
            </form>

            <div class="text-center mt-3">
              <small class="text-muted">
                Sudah punya akun?
                <a href="login-ambalan.html" class="text-success fw-semibold">
                  Login
                </a>
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"></script>

    <!-- LocalStorage Script -->
    <script>
      document
        .getElementById("registerForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const nama = document.getElementById("nama").value;
          const nta = document.getElementById("nta").value;
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;
          const suratFile = document.getElementById("surat").files[0];

          if (password !== confirmPassword) {
            alert("Password dan konfirmasi password tidak sama!");
            return;
          }

          const reader = new FileReader();
          reader.onload = function () {
            const suratBase64 = reader.result;

            let dbAmbalan =
              JSON.parse(localStorage.getItem("db_ambalan")) || [];

            const dataUser = {
              nama: nama,
              nta: nta,
              email: email,
              password: password,
              surat_aktif: suratBase64,
              tanggal_daftar: new Date().toISOString(),
            };

            dbAmbalan.push(dataUser);
            localStorage.setItem("db_ambalan", JSON.stringify(dbAmbalan));

            alert("Pendaftaran berhasil!");
            window.location.href = "login-ambalan.html";
          };

          reader.readAsDataURL(suratFile);
        });
    </script>
  </body>
</html>

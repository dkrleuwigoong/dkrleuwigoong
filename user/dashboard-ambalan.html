<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIMPLE</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark fixed-top">
      <div class="container-fluid">
        <!-- HAMBURGER -->
        <button
          class="btn text-white fs-4"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasExample">
          <i class="bi bi-list"></i>
        </button>

        <!-- TITLE -->
        <span class="navbar-brand ms-2">Dashboard</span>

        <!-- RIGHT ICON -->
        <div class="ms-auto d-flex align-items-center gap-3">
          <!-- NOTIF -->
          <button class="btn text-white position-relative">
            <i class="bi bi-bell fs-5"></i>
            <span
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
              3
            </span>
          </button>
        </div>
      </div>
    </nav>

    <!-- OFFCANVAS SIDEBAR -->
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title">SIMPLE</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"></button>
      </div>

      <div class="offcanvas-body p-0">
        <ul class="list-group list-group-flush">
          <li class="list-group-item">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
          </li>
          <li class="list-group-item">
            <i class="bi bi-person me-2"></i> Profil
          </li>
          <li class="list-group-item">
            <i class="bi bi-book me-2"></i> Akademik
          </li>
          <li class="list-group-item">
            <i class="bi bi-people me-2"></i> Kesiswaan
          </li>
          <li class="list-group-item">
            <i class="bi bi-mortarboard me-2"></i> PPDB
          </li>
          <li class="list-group-item text-danger">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
          </li>
        </ul>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="container" style="margin-top: 90px">
      <h3>Selamat Datang</h3>
      <p>Ini adalah halaman dashboard.</p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
